<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1015" height="700" viewBox="120 250 1015 700" fill="none" role="img" aria-labelledby="title description">
<title id="title">TENPEST — Cyber Security</title>
<desc id="description">Logo TENPEST com chuva caindo continuamente e raio animado em sequência. Fundo transparente. Respeita preferência por movimento reduzido.</desc>

<style>
  #Chuva-digital path { animation:rain var(--duration) linear var(--delay) infinite; }
  @keyframes rain {
    0% { transform:translateY(0);opacity:0; }
    20% { opacity:.9; }
    75% { opacity:.7; }
    100% { transform:translateY(120px);opacity:0; }
  }
  #Raio-superior path,#Raio-inferior path { stroke-dasharray:1; animation:bolt 4.8s linear infinite; }
  #Raio-inferior path { animation-delay:-4.32s; }
  @keyframes bolt {
    0%,5% { stroke-dashoffset:1;opacity:.2; }
    18%,24% { stroke-dashoffset:0;opacity:1; }
    65%,99% { stroke-dashoffset:0;opacity:.2; }
    100% { stroke-dashoffset:1;opacity:.2; }
  }
  @media(prefers-reduced-motion:reduce) {
    #Chuva-digital path,#Raio-superior path,#Raio-inferior path { animation:none;stroke-dashoffset:0; }
  }
</style>
